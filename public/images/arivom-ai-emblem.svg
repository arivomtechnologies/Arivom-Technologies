<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Cosmic Container Gradient -->
    <linearGradient id="ai-cosmic-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#070F1E" />
    </linearGradient>

    <!-- Outer Tech Glow Ring -->
    <linearGradient id="ai-ring-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>

    <!-- Core A: Left Leg Gradient -->
    <linearGradient id="ai-a-left" x1="26" y1="76" x2="48" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E55000" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <!-- Core A: Right Leg Gradient -->
    <linearGradient id="ai-a-right" x1="48" y1="22" x2="72" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#E55000" />
    </linearGradient>

    <!-- AI Arrow Swoosh Gradient -->
    <linearGradient id="ai-arrow-grad" x1="24" y1="72" x2="84" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E55000" />
      <stop offset="35%" stop-color="#FF6A00" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFF070" />
    </linearGradient>

    <!-- Glow Filter for Sparkle -->
    <filter id="ai-sparkle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FFB300" flood-opacity="0.9" />
    </filter>

    <filter id="ai-core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="50" cy="50" r="47" fill="url(#ai-cosmic-bg)" stroke="url(#ai-ring-grad)" stroke-width="2" />

  <!-- Subtle Concentric Tech Grid Rings -->
  <circle cx="50" cy="50" r="39" stroke="#FF6A00" stroke-opacity="0.25" stroke-dasharray="2 3" />
  <circle cx="50" cy="50" r="28" stroke="#38BDF8" stroke-opacity="0.15" stroke-dasharray="1.5 2.5" />

  <!-- Ambient Energy Glow Behind the A -->
  <circle cx="50" cy="50" r="18" fill="#FF6A00" opacity="0.25" filter="blur(8px)" />

  <!-- A Body - Left Leg -->
  <path 
    d="M 48 22 C 46 22 44.5 23.2 43.5 25.5 L 26 71.5 C 25 73.5 26.5 76 29 76 L 35.5 76 C 37 76 38.2 75 39 73.5 L 43.5 62 L 48 44 L 48 22 Z" 
    fill="url(#ai-a-left)" 
  />

  <!-- A Body - Right Leg -->
  <path 
    d="M 48 22 C 50 22 51.5 23.2 52.5 25.5 L 70 71.5 C 71 73.5 69.5 76 67 76 L 60.5 76 C 59 76 57.8 75 57 73.5 L 52.5 62 L 48 44 L 48 22 Z" 
    fill="url(#ai-a-right)" 
  />

  <!-- Upward Trajectory Arrow Swoosh with Drop Shadow -->
  <path 
    filter="url(#ai-core-glow)"
    d="M 25 70 C 33 59, 50 47, 72 42.5 L 70.8 37.5 C 70.8 36.8 71.7 36.3 72.3 36.8 L 84.5 42 C 85.2 42.3 85.2 43.4 84.5 43.7 L 73.2 49.5 C 72.5 49.8 71.7 49.3 71.7 48.6 L 72.2 45 C 51.5 49.5 35 60.5 26.5 74 C 25.5 73.2 25 71.5 25 70 Z" 
    fill="url(#ai-arrow-grad)" 
  />

  <!-- AI Intelligence Core Sparkle Star at the Arrow Tip -->
  <g filter="url(#ai-sparkle-glow)">
    <path 
      d="M 85 36 C 85 32 87 30 91 30 C 87 30 85 28 85 24 C 85 28 83 30 79 30 C 83 30 85 32 85 36 Z" 
      fill="#FFFFFF" 
    />
  </g>

  <!-- Mini Sparkle Satellite -->
  <circle cx="89" cy="24" r="1.5" fill="#FFE082" />
  <circle cx="27" cy="30" r="1" fill="#FFBA66" opacity="0.6" />
</svg>
