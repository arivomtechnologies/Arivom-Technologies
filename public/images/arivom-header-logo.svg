<svg viewBox="0 0 110 95" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Leg Gradient -->
    <linearGradient id="a-leg-left" x1="16" y1="84" x2="50" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E55000" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <!-- Right Leg Gradient -->
    <linearGradient id="a-leg-right" x1="50" y1="10" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#E55000" />
    </linearGradient>

    <!-- Rising Arc Arrow Gradient -->
    <linearGradient id="a-arrow-grad" x1="15" y1="80" x2="98" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E55000" />
      <stop offset="35%" stop-color="#FF6A00" />
      <stop offset="75%" stop-color="#FF9D00" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <filter id="a-arrow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.5" flood-color="#802000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Leg of A -->
  <path 
    d="M 50 10 C 47.5 10 45.8 11.5 44.5 14.5 L 16 78 C 14.8 80.5 16.5 83.5 19.5 83.5 L 29.5 83.5 C 31.5 83.5 33.2 82.2 34.2 80.2 L 42.5 63.5 L 50 42 L 50 10 Z" 
    fill="url(#a-leg-left)" 
  />

  <!-- Right Leg of A -->
  <path 
    d="M 50 10 C 52.5 10 54.2 11.5 55.5 14.5 L 84 78 C 85.2 80.5 83.5 83.5 80.5 83.5 L 70.5 83.5 C 68.5 83.5 66.8 82.2 65.8 80.2 L 57.5 63.5 L 50 42 L 50 10 Z" 
    fill="url(#a-leg-right)" 
  />

  <!-- Upward Arched Growth Arrow -->
  <path 
    filter="url(#a-arrow-shadow)"
    d="M 15 76 C 26 62, 50 46, 81 40 L 79.5 33.5 C 79.5 32.5 80.7 32 81.4 32.6 L 98.5 39.5 C 99.5 39.9 99.5 41.3 98.5 41.7 L 82.8 49.5 C 82 49.9 81 49.3 81 48.4 L 81.5 44 C 52.5 50, 30.5 64.5, 17 81.5 C 15.8 80.5 15 78.5 15 76 Z" 
    fill="url(#a-arrow-grad)" 
  />
</svg>
