<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Leg: Deep Vermilion to Signature Electric Orange -->
    <linearGradient id="arivom-orange-left" x1="16" y1="82" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="45%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Right Leg: Signature Orange to Radiant Golden Amber -->
    <linearGradient id="arivom-orange-right" x1="50" y1="14" x2="84" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Translucent Amber/Gold Ribbon Crossing Inside Arch -->
    <linearGradient id="arivom-inner-ribbon" x1="32" y1="46" x2="72" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.85" />
    </linearGradient>

    <!-- Center Floating Dot Gradient -->
    <linearGradient id="arivom-center-dot" x1="44" y1="65" x2="56" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
  </defs>

  <!-- Left Main Arch with rounded bottom cap -->
  <path 
    d="M24 80 C20.5 80 17.5 77.2 17.5 73.7 C17.5 72.2 18.1 70.8 19.1 69.8 L45.8 18.2 C46.8 16.2 48.8 15 51 15 C53.2 15 55.2 16.2 56.2 18.2 L82.9 69.8 C83.9 70.8 84.5 72.2 84.5 73.7 C84.5 77.2 81.5 80 78 80 C76.2 80 74.6 79.2 73.5 77.8 L51 34 L28.5 77.8 C27.4 79.2 25.8 80 24 80 Z" 
    fill="url(#arivom-orange-left)" 
  />

  <!-- Right Dynamic Arch Overlap with Amber Gradient -->
  <path 
    d="M51 15 C53.2 15 55.2 16.2 56.2 18.2 L82.9 69.8 C83.9 70.8 84.5 72.2 84.5 73.7 C84.5 77.2 81.5 80 78 80 C76.2 80 74.6 79.2 73.5 77.8 L51 34 L42.5 50.5 C40.8 46.8 45 41 49 35.5 L51 15 Z" 
    fill="url(#arivom-orange-right)" 
  />

  <!-- Inner Dynamic Amber Swirl / Crossbar Highlight -->
  <path 
    d="M38 56 C43 46 54 44 62 49 L70 65 C63 57 53 54 45 58 L38 56 Z" 
    fill="url(#arivom-inner-ribbon)" 
  />

  <!-- Central Floating Circular Dot Node -->
  <circle cx="51" cy="72" r="6" fill="url(#arivom-center-dot)" />
</svg>
